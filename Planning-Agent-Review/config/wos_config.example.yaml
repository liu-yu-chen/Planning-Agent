# Copy to wos_config.yaml and fill values locally. Never commit API credentials.
api:
  type: YOUR_ACCESS_TIER
  timeout_seconds: YOUR_TIMEOUT
  max_retries: YOUR_RETRY_LIMIT
  requests_per_second: YOUR_APPROVED_RATE
  max_daily_requests: YOUR_DAILY_CAP
  page_size: YOUR_PAGE_SIZE
  database: YOUR_DATABASE_NAME
  api_key_env: WOS_API_KEY
  subscription_key_env: WOS_SUBSCRIPTION_KEY
collection:
  start_year: YOUR_START_YEAR
  end_year: YOUR_END_YEAR
  dry_run_samples_per_query: YOUR_SAMPLE_SIZE
  fuzzy_title_review_threshold: YOUR_REVIEW_THRESHOLD
  document_types:
    include: [YOUR_DOCUMENT_TYPE]
    exclude: []
paths:
  raw_dir: data/raw
  normalized_dir: data/normalized
  summary: data/summary.json
  checkpoint: data/checkpoint.json
  log: logs/collector.log
